name: astrbot_plugin_ark_guess
display_name: 明日方舟猜干员
short_desc: 五维提示猜干员，支持隐藏势力黄牌、多局并行与独立干员检索
desc: |
  基于 PRTS 干员数据（434 名干员）的猜干员游戏。

  每次猜测给出稀有度、职业/分支、阵营、种族、实装年份五个维度的提示：
  绿色 √ 正确，黄色 ~ 部分命中，蓝色 ↑/↓ 方向提示，红色 × 错误。

  对局结果由 Pillow 在本地绘制为 PNG 卡片后发送（不依赖 HTML/网络），
  绘图失败时自动回退为文本表格。

  独立检索命令：/查干员 关键词（不影响对局或猜测次数）。

  **每个群固定只有一个对局**：/粥一把 开始（已有对局则返回当前进度），
  /粥一把 干员名 开始并立即猜一次，/猜干员 干员名 继续猜测，/不猜了 结束当前对局。
version: 1.2.1
author: Left-Leaf
repo: https://github.com/Left-Leaf/astrbot_plugin_ark_guess
