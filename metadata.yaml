name: astrbot_plugin_ark_guess
display_name: 明日方舟猜干员
short_desc: 五维提示猜干员，玛一把以玛恩纳首猜开局
desc: |
  基于 PRTS 干员数据（434 名干员）的猜干员游戏。

  每次猜测给出稀有度、职业/分支、阵营、种族、实装年份五个维度的提示：
  绿色 √ 正确，黄色 ~ 部分命中，蓝色 ↑/↓ 方向提示，红色 × 错误。

  对局结果由 Pillow 在本地绘制为 PNG 卡片后发送（不依赖 HTML/网络），
  绘图失败时自动回退为文本表格。

  群聊中艾特机器人并发送“猜干员”开始；“玛一把”以玛恩纳作为首猜，“粥一把”普通开局，两个别名均可裸发或艾特触发。对局中艾特机器人并发送干员名即可猜测，输入“不猜了”结束。
  独立检索命令：/查干员 关键词（不影响对局或猜测次数）。

  **每个群固定只有一个对局**；无对局时输入“不猜了”不会回复。
version: 1.3.2
