name: astrbot_plugin_ark_guess
display_name: 明日方舟猜干员 / 猜敌人
short_desc: 五维猜干员、六维猜敌人，每组可切换题库
desc: |
  基于 PRTS 数据的明日方舟猜谜游戏：434 名干员 + 1718 名敌人。

  干员五维：稀有度、职业/分支、阵营、种族、实装年份（副标题显示登场活动）。
  敌人六维：危险等级（普通/精英/领袖）、耐久、攻击、防御、法术抗性、登场活动。
  绿色 √ 正确，黄色 ~ 部分命中，蓝色 ↑/↓ 方向提示，红色 × 错误。

  对局结果由 Pillow 在本地绘制为 PNG 卡片后发送（不依赖 HTML/网络），
  绘图失败时自动回退为文本表格。

  群聊中用“/更换干员池”“/更换敌人池”切换题库（必须带 /，进行中的对局需先结束）。
  干员池：艾特机器人并发送“猜干员 干员名”开局并猜测；“玛一把”以玛恩纳作为首猜；“粥一把 干员名”也可裸发或艾特触发。
  敌人池：艾特机器人并发送“猜敌人 敌人名”开局并猜测。
  对局中艾特机器人并发送名称即可猜测，输入“不猜了”结束。
  独立检索命令：/查干员 关键词、/查敌人 关键词（不影响对局或猜测次数）。
  按群难度：“/角色池设置 1256”设置干员答案稀有度，“/猜测次数 8”设置最大次数（-1 不限）；发送“/本群难度”查看，“/重置难度”恢复默认。

  **每个群同时只启用一个题库**；无对局时输入“不猜了”不会回复。
